version: "3.9"

services:
  # ── Backend (FastAPI + Whisper) ──
  backend:
    build: ./backend
    container_name: transcription-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount source code for development (hot-reload with --reload)
      - ./backend:/app
    restart: unless-stopped

  # ── Frontend (React + Vite → Nginx) ──
  frontend:
    build: ./frontend
    container_name: transcription-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
